<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小説読み上げ設定</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="title">🔊 小説読み上げ</span>
      <span id="connection-status" class="status-badge">確認中...</span>
    </div>

    <div class="section">
      <label class="label">エンジン</label>
      <div class="engine-tabs">
        <button id="engine-coeiroink" class="engine-tab active" data-engine="coeiroink">COEIROINK</button>
        <button id="engine-chrome" class="engine-tab" data-engine="chrome">Chrome TTS</button>
      </div>
    </div>

    <div class="section">
      <label class="label">話者</label>
      <select id="speaker-select" class="select">
        <option value="">読み込み中...</option>
      </select>
    </div>

    <div id="style-section" class="section">
      <label class="label">スタイル</label>
      <select id="style-select" class="select">
        <option value="">-</option>
      </select>
    </div>

    <div id="role-voices-section">
      <div class="divider"></div>
      <div class="section">
        <label class="label">会話文1の声（「」『』）</label>
        <div class="role-row">
          <select id="role-d1-speaker" class="select role-speaker"></select>
          <select id="role-d1-style" class="select role-style"></select>
        </div>
      </div>
      <div class="section">
        <label class="label">会話文2の声（会話が連続した時）</label>
        <div class="role-row">
          <select id="role-d2-speaker" class="select role-speaker"></select>
          <select id="role-d2-style" class="select role-style"></select>
        </div>
      </div>
      <div class="section">
        <label class="label">心の声（（））</label>
        <div class="role-row">
          <select id="role-mono-speaker" class="select role-speaker"></select>
          <select id="role-mono-style" class="select role-style"></select>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <label class="label">速度 <span id="speed-val">1.0</span>x</label>
      <input type="range" id="speed" class="range" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="section">
      <label class="label">音量 <span id="volume-val">1.0</span>x</label>
      <input type="range" id="volume" class="range" min="0.0" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="section">
      <label class="label">ピッチ <span id="pitch-val">0.0</span></label>
      <input type="range" id="pitch" class="range" min="-0.15" max="0.15" step="0.01" value="0.0">
    </div>

    <div id="intonation-section" class="section">
      <label class="label">抑揚 <span id="intonation-val">1.0</span></label>
      <input type="range" id="intonation" class="range" min="0.0" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="footer">
      <button id="save-btn" class="btn-save">設定を保存</button>
      <span id="save-status" class="save-status"></span>
    </div>
  </div>
  <script type="module" src="../src/popup/popup.ts"></script>
</body>
</html>
